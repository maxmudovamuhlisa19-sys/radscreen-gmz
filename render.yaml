services:
  - type: web
    name: radscreen-gmz
    runtime: node
    plan: free
    # Paketlar ro'yxati Blueprint sxemasida qo'llab-quvvatlanmaydi; Render node
    # runtime da python3/pip3 odatda mavjud. edge-tts o'rnatilmasa — build baribir
    # davom etadi (ovoz uchun brauzer Web Speech API fallback ishlaydi).
    buildCommand: (pip3 install --break-system-packages --quiet edge-tts || pip3 install --quiet edge-tts || true) && npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON
        value: python3
